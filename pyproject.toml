[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "envxx"
# single source of truth: envxx.__version__, so a frozen binary reports the
# same number as the package metadata without a build step rewriting anything
dynamic = ["version"]
description = "Portable multi-runtime manager for Python, Node.js and friends"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
]

[project.scripts]
envxx = "envxx.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.version]
path = "envxx/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["envxx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that hit the network",
]
